<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - SNT Gaming</title>
  <!-- On remonte d'un dossier pour aller chercher la feuille de style globale -->
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../images/ton-logo.png">
</head>

  <header class="header">
    <a href="index.html" class="logo">GameHub</a>

    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../index.html" class="nav-link">Accueil</a></li>
        <li><a href="forums.html" class="nav-link">Forums</a></li>
        <li><a href="actualitees.html" class="nav-link">Actualitées</a></li>
		<li><a href="connexion.html" class="nav-link">Connexion</a></li>
	  </ul>
    </nav>

	<div class="theme-wrapper">
		<span class="theme-label" id="theme-text">LIGHT</span>
		<label class="theme-switch">
			<input type="checkbox" id="toggle">
			<span class="slider"></span>
		</label>
	</div> 
</header>

<body class="auth-page">

  <main class="auth-container">
<div class="auth-box">

  <a href="../index.html" class="back-link">&larr; Retour à l'accueil</a>

  <!-- Onglets pour basculer -->
  <div class="auth-tabs">
    <button class="tab-btn active" id="tab-login">Connexion</button>
    <button class="tab-btn" id="tab-register">Inscription</button>
  </div>

  <!-- Formulaire de Connexion -->
  <form id="login-form" class="auth-form">
    <h2>Connexion</h2>
    <p class="auth-subtitle">Bon retour sur GameHub</p>

    <button type="button" class="btn-google">
      <!-- SVG Google -->
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continuer avec Google
    </button>

    <div class="separator"><span>ou</span></div>

    <div class="form-group">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" placeholder="nom@exemple.com" required>
    </div>
    <div class="form-group">
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit">Se connecter</button>
  </form>

  <!-- Formulaire d'Inscription (caché par défaut) -->
  <form id="register-form" class="auth-form" style="display: none;">
    <h2>Inscription</h2>
    <p class="auth-subtitle">Crée ton compte GameHub</p>

    <div class="form-group">
      <label for="reg-pseudo">Pseudo</label>
      <input type="text" id="reg-pseudo" placeholder="" required>
    </div>
    <div class="form-group">
      <label for="reg-email">E-mail</label>
      <input type="email" id="reg-email" placeholder="" required>
    </div>
    <div class="form-group">
      <label for="reg-password">Mot de passe</label>
      <input type="password" id="reg-password" placeholder="" required>
    </div>
    <button type="submit" class="btn-submit">S'inscrire</button>
  </form>
</div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
